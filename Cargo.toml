[package]
name = "muzanci-runner"
version = "0.1.0"
edition = "2024"

[dependencies]
aws-lc-rs = { version = "1", features = ["bindgen"] }
http = "1.4.2"
hyper = { version = "1.10.1", features = ["client", "http1"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.3", features = ["io-util", "net", "fs", "rt-multi-thread", "process", "signal"] }
muzanci-transport = { path = "../muzanci-transport" }
muzanci-config = { path = "../muzanci-config" }
muzanci-image = { path = "../muzanci-image" }
muzanci-git = { path = "../muzanci-git" }
rustls = { version = "0.23.40"}
tokio-rustls = "0.26.4"
anyhow = "1.0.102"
hyper-util = { version = "0.1.20", features = ["tokio"] }
http-body-util = "0.1.3"
bytes = "1.11.1"
futures = "0.3.32"
uuid = { version = "1.23.3", features = ["v7"] }
russh = { version = "0.62.6"}
russh-keys = "0.49.2"
nix = { version = "0.31.3", features = ["fs", "term"] }
rand = "0.10.1"
tempfile = "3.24.0"
tokio-util = "0.7.18"
thiserror = "2.0.18"
async-trait = "0.1.89"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing-appender = "0.2.5"
tracing-error = "0.2.1"
serde_json = "1.0.150"
sha2 = "0.11.0"
hex = "0.4.3"
url = "2.5.8"
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
async-fd-lock = "0.2.0"
async-compression = { version = "0.4.43", features = ["gzip", "tokio"] }
tokio-stream = "0.1.19"
tokio-tar = "0.3.1"
futures-util = "0.3.33"
strum = { version = "0.28.0", features = ["derive", "strum_macros"] }
serde_with = "3.21.0"
libc = "0.2.189"

[lib]
name = "muzanci_runner"
path = "src/lib.rs"

[[bin]]
name = "runner"
path = "src/main.rs"
test = false

[[test]]
name = "rootfs_freebsd_integration_test"
path = "tests/rootfs_freebsd_integration_test.rs"
harness = false

[[test]]
name = "sandbox_freebsd_integration_test"
path = "tests/sandbox_freebsd_integration_test.rs"
harness = false

[[test]]
name = "rootfs_linux_integration_test"
path = "tests/rootfs_linux_integration_test.rs"
harness = false

[[test]]
name = "sandbox_linux_integration_test"
path = "tests/sandbox_linux_integration_test.rs"
harness = false
